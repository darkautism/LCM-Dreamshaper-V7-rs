name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Build and publish prerelease image to GHCR (tag :prerelease)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_NAME: ghcr.io/shiwarai/lcm-dreamshaper-v7-rs

jobs:
  test:
    name: Run tests in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set runner user for containers
        run: |
          echo "RUNNER_UID=$(id -u)" >> $GITHUB_ENV
          echo "RUNNER_GID=$(id -g)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile.dev
          tags: dreamshaper-dev:latest
          load: true
          push: false
          cache-from: type=gha,scope=lcm-dreamshaper-dev
          cache-to: type=gha,mode=max,scope=lcm-dreamshaper-dev

      - name: Clippy
        run: |
          set -e
          docker compose -f docker-compose.dev.yml run --rm -T dev cargo clippy --all-targets -- -D warnings

      - name: Run tests in container
        run: |
          docker compose -f docker-compose.dev.yml run --rm dev cargo test -- --nocapture

  publish-prerelease:
    name: Publish prerelease image to GHCR
    needs: test
    if: |
      needs.test.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_prerelease == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dreamshaper (prerelease)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:prerelease
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=lcm-dreamshaper-prerelease
          cache-to: type=gha,mode=max,scope=lcm-dreamshaper-prerelease

  notify-telegram:
    name: Notify Telegram
    needs: [test, publish-prerelease]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tests failed
        if: needs.test.result != 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Tests failed*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            [Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Tests OK, prerelease failed
        if: needs.test.result == 'success' && needs.publish-prerelease.result == 'failure'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Tests passed, prerelease failed*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            [Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Tests OK, prerelease published
        if: needs.test.result == 'success' && needs.publish-prerelease.result == 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Tests and prerelease succeeded*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            Tags: `:prerelease` and `:${{ github.sha }}`
            Image: `ghcr.io/shiwarai/lcm-dreamshaper-v7-rs:prerelease`
            [Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Tests OK (no prerelease)
        if: needs.test.result == 'success' && needs.publish-prerelease.result == 'skipped'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Tests passed*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.ref_name }}`
            [Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
