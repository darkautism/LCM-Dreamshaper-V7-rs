name: Publish Docker image

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/shiwarai/lcm-dreamshaper-v7-rs

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dreamshaper
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=lcm-dreamshaper-main
          cache-to: type=gha,mode=max,scope=lcm-dreamshaper-main

  notify-telegram-on-publish:
    name: Notify Telegram on image published
    if: always() && needs.publish.result == 'success'
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification (silent)
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Image published to GHCR*
            Repository: `${{ github.repository }}`
            Branch: `${{ github.event.workflow_run.head_branch }}`
            Image: `ghcr.io/shiwarai/lcm-dreamshaper-v7-rs:main`
            [Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
